set -g base-index 1
set -g renumber-windows on
set -g history-limit 50000

set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

# Easier and faster switching between next/prev window
bind C-p previous-window
bind C-n next-window

# Enable Alt+Arrow keys to switch panes
# bind -n M-Left select-pane -L
# bind -n M-Right select-pane -R
# bind -n M-Up select-pane -U
# bind -n M-Down select-pane -D

unbind %
bind | split-window -h

unbind '"'
bind - split-window -v

# Enable mouse support
set -g mouse on
setw -g mode-keys vi

# don't copy on select
unbind -T copy-mode-vi MouseDragEnd1Pane

# don't copy on Enter
# unbind -T copy-mode-vi Enter

bind v copy-mode   # Prefix v enters copy mode

# Bind 'v' to begin visual selection (same as Space) inside copy mode
bind-key -T copy-mode-vi v send-keys -X begin-selection

# Bind 'y' and 'Ctrl+c' to yank
bind-key -T copy-mode-vi y send-keys -X copy-selection
bind-key -T copy-mode-vi C-c send-keys -X copy-selection

# reload tmux config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# tmux-sessionizer shell start
bind-key f run-shell "tmux neww ~/.local/scripts/tmux-sessionizer"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Theme
# set -g @plugin 'egel/tmux-gruvbox'
# set -g @tmux-gruvbox 'dark' # or 'dark256', 'light', 'light256'

# Rose pine theme
set -g @plugin 'rose-pine/tmux'
set -g @rose_pine_variant 'main' # Options are 'main', 'moon' or 'dawn'
set -g @rose_pine_disable_active_window_menu 'on'
set -g @rose_pine_session_icon ' '
set -g @rose_pine_window_status_separator ' '

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# this needs to be after 'run' above to override what the theme drew
set -g status-left '#[fg=#31748f,bold] #S #[default]'
